<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Juliana</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 2rem 1rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #0f0;
        }

        .field-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #ccc;
        }

        input {
            padding: 14px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0f0;
            box-shadow: 0 0 0 3px rgba(0, 255, 0, 0.2);
        }

        .btn-container {
            margin-top: 2rem;
        }

        button {
            padding: 16px;
            font-size: 1.1rem;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-update {
            background: #0f0;
            color: #000;
            margin-bottom: 1rem;
        }

        .btn-update:hover {
            background: #0d0;
            transform: translateY(-1px);
        }

        .btn-update:active {
            transform: translateY(0);
            background: #0c0;
        }

        .btn-party {
            background: #ff00ff;
            color: #fff;
        }

        .btn-party:hover {
            background: #e600e6;
            transform: translateY(-1px);
        }

        .btn-party:active {
            transform: translateY(0);
            background: #cc00cc;
        }

        .status {
            margin-top: 1.5rem;
            color: #888;
            text-align: center;
            font-weight: 500;
            min-height: 1.5rem;
        }

        .hint {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
        }

        hr {
            border: none;
            border-top: 1px solid #333;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <h1>Configurar festa 🎉</h1>

    <div class="field-group">
        <label for="inputNome">Seu Nome:</label>
        <input type="text" id="inputNome" placeholder="Quem está mandando?">
    </div>

    <div class="field-group">
        <label for="inputTexto">Mensagem:</label>
        <input type="text" id="inputTexto" placeholder="Digite a mensagem..."
            value="Parabéns Juliana 🎉 🎂 🥳 🥂 🍾 🎊 🎈 🎁 💖 💝">
    </div>

    <div class="field-group">
        <label for="inputYoutube">Música (link do youTube):</label>
        <input type="text" id="inputYoutube" placeholder="Cole o link aqui..."
            value="https://www.youtube.com/watch?v=SRVxRUJxITY">
        <p class="hint">Cole o link completo. Ex: https://www.youtube.com/watch?v=SRVxRUJxITY</p>
    </div>

    <div class="field-group">
        <label for="inputVelocidade">Velocidade (segundos):</label>
        <input type="number" id="inputVelocidade" value="15" min="5" max="100">
    </div>

    <!-- CONFIGURAÇÃO DE BUCKET -->
    <hr>
    <div class="field-group">
        <label for="inputBucket">ID do Bucket (Servidor):</label>
        <input type="text" id="inputBucket" placeholder="Nx4..." style="border-color: #666;">
        <p class="hint">Padrão: Nx4eX6XbVusH98XQ86tkpg</p>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
            <a href="https://kvdb.io" target="_blank" style="color:#0f0; text-decoration:none; font-size:0.8rem;">+
                Criar Novo Bucket</a>
            <button onclick="salvarBucket()"
                style="width: auto; padding: 5px 15px; font-size: 0.8rem; background:#333; color:#fff;">SALVAR
                ID</button>
        </div>
        <div id="quota-warning"
            style="display:none; color: orange; font-weight:bold; margin-top:10px; border:1px solid orange; padding:5px;">
            ⚠️ Atenção: Cota de operações acabando! Restam: <span id="quota-lefs">?</span>
        </div>
    </div>
    <hr>

    <div class="btn-container">
        <button class="btn-update" onclick="enviarDados(false)">ATUALIZAR TUDO</button>
        <hr>
        <button class="btn-party" onclick="enviarDados(true)">SOLTAR CONFETES AGORA 🎊</button>
    </div>

    <p class="status" id="status">Aguardando...</p>

    <script>
        // --- CONFIGURAÇÃO ---
        const DEFAULT_BUCKET_ID = "Nx4eX6XbVusH98XQ86tkpg";
        // Tenta ler do localStorage, se não tiver usa o default
        let BUCKET_ID = localStorage.getItem("juliana_bucket_id") || DEFAULT_BUCKET_ID;

        const KEY = "mensagem";
        // A URL será construída dinamicamente nas funções para permitir troca imediata

        // Preenche o input de bucket na carga
        document.getElementById('inputBucket').value = BUCKET_ID;

        function getUrl() {
            return `https://kvdb.io/${BUCKET_ID}/${KEY}`;
        }


        // Função auxiliar para extrair o ID do vídeo de qualquer link do YouTube
        function extrairIdYoutube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function enviarDados(apenasConfete) {
            const nome = document.getElementById('inputNome').value;
            let texto = document.getElementById('inputTexto').value;
            const velocidade = document.getElementById('inputVelocidade').value;
            const linkYoutube = document.getElementById('inputYoutube').value;
            const status = document.getElementById('status');

            status.innerText = "Lendo estado atual...";

            try {
                // 1. Ler estado atual para não perder a fila
                let dadosAtuais = {};
                try {
                    const r = await fetch(getUrl());
                    if (r.ok) {
                        dadosAtuais = await r.json();
                        verificarCota(r); // Checa cota na leitura também
                    }
                } catch (e) {
                    console.log("KVDB vazio ou erro de leitura", e);
                }

                // Garante que existe array queue
                if (!dadosAtuais.queue || !Array.isArray(dadosAtuais.queue)) {
                    dadosAtuais.queue = [];
                }

                // 2. Processar Confete
                if (apenasConfete) {
                    dadosAtuais.confeteToken = Date.now();
                } else {
                    // 3. Processar Nova Mensagem

                    // Extrai o ID limpo
                    let videoId = extrairIdYoutube(linkYoutube);
                    if (!videoId) videoId = "SRVxRUJxITY"; // Fallback

                    // Verifica prioridade
                    let furarFila = false;
                    if (texto.trim().endsWith("--f") || texto.trim().endsWith("--force")) {
                        furarFila = true;
                        texto = texto.replace(/--f(orce)?$/, "").trim();
                    }

                    const novaMensagem = {
                        sender: nome || "Anônimo",
                        text: texto,
                        speed: velocidade,
                        videoId: videoId,
                        timestamp: Date.now()
                    };

                    if (furarFila) {
                        // Insere logo no início (próxima a ser tocada)
                        // Se já tiver uma tocando (índice 0), a gente coloca no índice 1 pra não cortar a atual abruptamente?
                        // O requisito diz: "seja apresenta logo em seguida a que está sendo apresentada"
                        // Então se a fila tem [A, B, C] e A está tocando. Eu quero que D entre depois de A.
                        // Fila vira [A, D, B, C].
                        // Se a fila estiver vazia, vira [D].

                        // Como o index consome a fila[0], se inserirmos no 0, o index vai trocar imediatamente se ele reagir a mudanças no 0.
                        // Mas o admin não sabe o que o index está tocando exatamente, só o KVDB sabe a fila.
                        // Assumindo que o index NÃO apaga a mensagem do KVDB enquanto toca (só apaga quando termina),
                        // O item 0 é o "atual". Devemos inserir em 1.
                        if (dadosAtuais.queue.length > 0) {
                            dadosAtuais.queue.splice(1, 0, novaMensagem);
                        } else {
                            dadosAtuais.queue.push(novaMensagem);
                        }
                    } else {
                        // Fim da fila
                        dadosAtuais.queue.push(novaMensagem);
                    }
                }

                status.innerText = "Enviando...";

                await fetch(URL, {
                    method: 'POST',
                    body: JSON.stringify(dadosAtuais)
                });

                if (apenasConfete) {
                    status.innerText = "BUM! Confetes disparados! 🎉";
                    status.style.color = "#ff00ff";
                } else {
                    status.innerText = "Mensagem enfileirada com sucesso!";
                    status.style.color = "#0f0";

                    // Reset de campos para o padrão conforme solicitado
                    document.getElementById('inputNome').value = "";
                    document.getElementById('inputTexto').value = "Parabéns Juliana 🎉 🎂 🥳 🥂 🍾 🎊 🎈 🎁 💖 💝";
                    document.getElementById('inputYoutube').value = "https://www.youtube.com/watch?v=SRVxRUJxITY";
                    document.getElementById('inputVelocidade').value = 15;
                }

                setTimeout(() => { status.innerText = "Pronto."; status.style.color = "#aaa"; }, 3000);

            } catch (error) {
                status.innerText = "Erro ao enviar.";
                console.error(error);
            }
        }

        // Função para verificar cota nos headers
        function verificarCota(response) {
            // Headers comuns: X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset
            const remaining = response.headers.get("X-RateLimit-Remaining");

            if (remaining) {
                const limit = parseInt(remaining, 10);
                const warningBox = document.getElementById('quota-warning');

                if (limit < 1000) {
                    warningBox.style.display = 'block';
                    document.getElementById('quota-lefs').innerText = limit;

                    if (limit < 100) {
                        warningBox.style.color = 'red';
                        warningBox.style.borderColor = 'red';
                        warningBox.innerHTML = `🚨 CRÍTICO: Cota Esgotada (${limit} restantes).<br>Troque o Bucket ID imediatamente!`;
                    }
                } else {
                    warningBox.style.display = 'none';
                }
            } else {
                if (response.status === 429) {
                    const warningBox = document.getElementById('quota-warning');
                    warningBox.style.display = 'block';
                    warningBox.style.color = 'red';
                    warningBox.innerHTML = `🚨 ERRO 429: Cota Excedida. O sistema parou.<br>Crie um novo Bucket e troque o ID acima.`;
                }
            }
        }

        async function salvarBucket() {
            const novoId = document.getElementById('inputBucket').value.trim();
            if (!novoId) return alert("ID inválido");

            if (novoId === BUCKET_ID) return alert("Esse já é o ID atual.");

            if (!confirm("Atenção: Ao trocar o ID, enviaremos um aviso para conectar todas as telas ao novo Bucket. Confirma?")) return;

            // 1. Enviar Kill Switch/Broadcast no bucket ANTIGO
            const dadosTroca = {
                type: "config_change",
                newBucketId: novoId,
                timestamp: Date.now()
            };

            try {
                // Tenta avisar no bucket antigo
                await fetch(getUrl(), {
                    method: 'POST',
                    body: JSON.stringify(dadosTroca)
                });
            } catch (e) {
                console.error("Não foi possível avisar no bucket antigo, trocando localmente apenas.");
            }

            // 2. Salvar novo e recarregar
            localStorage.setItem("juliana_bucket_id", novoId);
            alert("ID Salvo! Recarregando...");
            window.location.reload();
        }
    </script>
</body>

</html>
